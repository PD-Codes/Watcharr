name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Two runs of the same branch help nobody; the newer commit wins.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Typecheck and tests
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      # --ignore-scripts for the same reason as the Dockerfile: better-sqlite3 ships
      # prebuilt binaries but also a binding.gyp, and npm recompiles it for nothing.
      # It is the only package here with an install script.
      - run: npm ci --ignore-scripts

      - run: npm run typecheck

      # Adapter mapping, suggestion scoring, migrations, aggregate SQL, encryption.
      - run: npm test

      # Builds the app, boots it against a stub media server and requests every route.
      # Slow, but it is the only suite that catches render and SQL dialect errors.
      - run: npm run test:routes

  docker:
    name: Docker build
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      # amd64 only here: this is a "does it still build" check, and emulating arm64 on
      # every pull request costs far more than it catches. The release workflow builds
      # both architectures for real.
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
