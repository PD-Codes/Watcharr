name: CI

# Runs when the version goes up, not on every commit: `version` in pyproject.toml is the one
# number a release is driven by (see release.yml), so that is the moment the suite has to hold.
# Anything in between is checked by hand with "Run workflow".
on:
  push:
    branches: [main]
    paths:
      - 'pyproject.toml'
  workflow_dispatch:

# Two runs of the same branch help nobody; the newer commit wins.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Typecheck and tests (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        # package.json promises >=22 and the Docker image ships 22; 24 guards the next upgrade.
        node: ['22.23.4', '24']

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - run: npm ci

      - run: npm run typecheck

      # Adapter mapping, suggestion scoring, migrations, aggregate SQL, encryption.
      - run: npm test

      # Builds the app, boots it against a stub media server and requests every route.
      # Slow, but it is the only suite that catches render and SQL dialect errors.
      - run: npm run test:routes

  docker:
    name: Docker build
    # Manual runs only: on a version bump the release workflow builds the image for real.
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      # amd64 only here: this is a "does it still build" check, and emulating arm64 for
      # it costs far more than it catches. The release workflow builds
      # both architectures for real.
      - uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
