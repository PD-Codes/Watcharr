services:
  app:
    # `docker compose up -d` pulls the published image.
    # `docker compose up -d --build` builds this checkout instead.
    image: ghcr.io/pd-codes/watcharr:${WATCHARR_TAG:-latest}
    build: .
    restart: unless-stopped
    # Reaps orphaned child processes, e.g. from a "script" notification channel that forks.
    init: true
    ports:
      # Bind address on the host. Unset: plain "3000:3000", all interfaces, IPv4 and IPv6 (a
      # default of 0.0.0.0 would publish IPv4 only). Set WATCHARR_BIND=127.0.0.1 behind a reverse
      # proxy on the same host: without a proxy in front, X-Forwarded-For is client-controlled and
      # can be forged, which defeats rate limits and the login/IP history. The ":+" part adds the
      # separating colon only when an address is set.
      - "${WATCHARR_BIND:-}${WATCHARR_BIND:+:}3000:3000"
    environment:
      SESSION_SECRET: ${SESSION_SECRET:?set SESSION_SECRET in .env}
      APP_URL: ${APP_URL:-http://localhost:3000}
      # SQLite database file, kept on the named volume below.
      DATABASE_PATH: /app/data/watcharr.db
      # Only files in here can be run by a "script" notification channel.
      WATCHARR_SCRIPTS_DIR: /app/data/scripts
      # Days, weekdays and hours are counted in the app's configured zone; this is only
      # the fallback for an installation that has not chosen one under Settings.
      TZ: ${TZ:-UTC}
      # Parallel read-only connections for the statistics (0 turns them off).
      # WATCHARR_DB_READERS: "2"
      # On a network share (NFS/SMB) or a Docker Desktop bind mount the app switches SQLite to an
      # exclusive lock by itself; "normal" or "exclusive" overrides that detection.
      # WATCHARR_DB_LOCKING: exclusive
    volumes:
      - watcharr-data:/app/data
      # Uncomment to import from Tautulli: mount its folder read-only and point the import
      # page at /import/tautulli.db. A Tautulli database is far too large to upload.
      # - /path/to/tautulli:/import:ro
    healthcheck:
      # 127.0.0.1, not localhost: the server listens on IPv4 only. ?live=1 checks the app and its
      # database but not the media servers, whose outage is not the container's fault.
      test: ["CMD-SHELL", "node -e \"fetch('http://127.0.0.1:3000/api/health?live=1').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\""]
      interval: 30s
      timeout: 10s
      retries: 3
      # Migrations, the pre-upgrade backup and a VACUUM of a big database all run before the
      # server listens, and on a few gigabytes that takes minutes. Failures inside this window do
      # not count; the first success marks the container healthy at once, so a quick start is
      # not held back by it.
      start_period: 5m

volumes:
  watcharr-data:
